# =============================================================================
# 小型智能仓储库位分配仿真系统 —— 后端配置
# 负责人：a（谢卓成）  COM-1 技术选型与项目脚手架
# 说明：本文件为本地开发默认配置；生产/演示环境请通过环境变量覆盖
#       （WMS_DB_URL / WMS_DB_USERNAME / WMS_DB_PASSWORD / WMS_JWT_SECRET）。
# =============================================================================

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: wms-sim

  # ---------- MVC：路径不存在时抛 NoHandlerFoundException，交由全局异常处理器输出 404 ----------
  mvc:
    throw-exception-if-no-handler-found: true
    # 关闭静态资源兜底映射，否则未匹配路径会被 ResourceHttpRequestHandler 接管而不是抛 404
    web:
      resources:
        add-mappings: false

  # ---------- 数据源：MySQL 8 ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${WMS_DB_URL:jdbc:mysql://127.0.0.1:3306/wms_sim?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}
    username: ${WMS_DB_USERNAME:root}
    password: ${WMS_DB_PASSWORD:123456}
    hikari:
      pool-name: wms-hikari
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---------- 数据库版本化管理：Flyway（a 牵头，COM-2） ----------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 认领「按 backend/sql/schema.sql 手工建过库」的既有数据库：
    # baseline-on-migrate 只在「库非空且无 flyway_schema_history」时生效，此时 Flyway 会把
    # baseline-version 记为已应用基线，忽略 V1~V3（它们的内容与既有结构一致，见
    # tools/build_schema_sql.py 生成的 schema.sql），此后从 V4 继续版本化。
    # 空库首次启动不受影响：库为空时不触发 baseline，仍会顺序执行 V1~V3。
    # 需要更严格的校验时，用环境变量把它调回 0：WMS_FLYWAY_BASELINE_VERSION=0
    baseline-version: ${WMS_FLYWAY_BASELINE_VERSION:3}
    validate-on-migrate: true
    encoding: UTF-8
    table: flyway_schema_history

  # ---------- JSON 序列化 ----------
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    time-zone: UTC
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  # ---------- 上传限制（API-037/038 批量导入 CSV/Excel） ----------
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# ---------- MyBatis-Plus ----------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    # 开发期打印 SQL；生产环境改为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: null
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.wms.domain.entity

# ---------- 业务自定义配置（a 的鉴权与安全参数） ----------
wms:
  # 数据访问实现：mysql（默认，数据来自 MySQL）/ memory（无库演示模式，内置演示数据）
  repository: ${WMS_REPOSITORY:mysql}
  security:
    # JWT 签名密钥：HS256 要求至少 32 字节；生产必须通过环境变量覆盖
    jwt-secret: ${WMS_JWT_SECRET:wms-sim-local-dev-secret-key-please-change-in-production}
    # Token 有效期（秒），默认 8 小时
    token-expire-seconds: 28800
    # 登录接口路径（白名单）
    login-path: /api/v1/auth/login
  cors:
    # 前端开发服务器地址（Vite 默认 5173）
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  # 分区（品类 ↔ 巷道）映射：locations 表无分区列，库位分区由所属货架的 racks.aisle 派生。
  # 供 b 的评分 S_other 品类匹配（FR-2.1）与 c 的「分区存储」策略（FR-3.1）使用，可配置（FR-2.3）。
  # 未配置的巷道 → 库位无分区约束，品类匹配取中性分，不影响推荐可用性。
  zone:
    aisle-category:
      A: 电子
      B: 食品
      C: 机械

# ---------- 日志 ----------
logging:
  level:
    root: INFO
    com.wms: DEBUG
    org.springframework.security: INFO
    com.baomidou.mybatisplus: INFO
